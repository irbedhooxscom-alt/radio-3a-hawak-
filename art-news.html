
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Tahoma, Arial, sans-serif;
}

.news {
  width: 100%;
  height: 100px;
  display: flex;
  align-items: center;
  background: linear-gradient(90deg,#160b35,#32105c,#160b35);
  border-right: 6px solid #ff1744;
  color: white;
  overflow: hidden;
}

.label {
  flex-shrink: 0;
  background: #d41445;
  padding: 12px 18px;
  font-size: 23px;
  font-weight: bold;
  z-index: 2;
}

#headline {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  font-size: 27px;
  font-weight: bold;
  padding: 0 20px;
  direction: rtl;
}

#headline span {
  display: inline-block;
  white-space: nowrap;
  animation: move 25s linear infinite;
}

@keyframes move {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}
</style>
</head>

<body>

<div class="news">
  <div class="label">🎬 أخبار فنية</div>
  <div id="headline">
    <span>🎙️ راديو ع هواك — أخبار الفن العربي والعالمي</span>
  </div>
</div>

<script>
const headline = document.getElementById("headline");

let newsItems = [];
let current = 0;

function showMessage(message) {
  headline.innerHTML = "";

  const span = document.createElement("span");
  span.textContent = message;
  headline.appendChild(span);
}

function showNext() {
  if (!newsItems.length) return;

  const item = newsItems[current % newsItems.length];

  showMessage(
    "🎬 " + item.title +
    "  |  " + (item.source || "أخبار فنية") +
    "  |  راديو ع هواك 🎙️"
  );

  current++;
}

async function updateNews() {
  showMessage("⏳ جاري تحديث أخبار الفن العربي والعالمي...");

  try {
    const response = await fetch(
      "./art-news.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("تعذر الوصول إلى ملف الأخبار");
    }

    const data = await response.json();

    if (!Array.isArray(data.news)) {
      throw new Error("صيغة ملف الأخبار غير صحيحة");
    }

    const unique = new Map();

    data.news.forEach(item => {
      if (item.title) {
        unique.set(item.title.trim(), item);
      }
    });

    newsItems = Array.from(unique.values())
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    if (newsItems.length > 0) {
      current = 0;
      showNext();
    } else {
      showMessage("🎙️ لا توجد أخبار فنية متاحة حاليًا — راديو ع هواك");
    }

  } catch (error) {
    console.error("Radio news error:", error);

    showMessage(
      "⚠️ تعذر تحديث الأخبار — سنحاول مجددًا — راديو ع هواك"
    );
  }
}

updateNews();

setInterval(showNext, 25000);
setInterval(updateNews, 5 * 60 * 1000);
</script>

</body>
</html>
