
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Tahoma, Arial, sans-serif;
}

.news {
  width: 100%;
  height: 100px;
  display: flex;
  align-items: center;
  background: linear-gradient(90deg,#160b35,#32105c,#160b35);
  border-right: 6px solid #ff1744;
  color: white;
  overflow: hidden;
}

.label {
  flex-shrink: 0;
  background: #d41445;
  padding: 12px 18px;
  font-size: 23px;
  font-weight: bold;
  z-index: 2;
}

#headline {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  font-size: 27px;
  font-weight: bold;
  padding: 0 20px;
}

#headline span {
  display: inline-block;
  white-space: nowrap;
  animation: move 25s linear infinite;
}

@keyframes move {
  from { transform: translateX(-100%); }
  to   { transform: translateX(100%); }
}
</style>
</head>

<body>

<div class="news">
  <div class="label">🎬 أخبار فنية</div>
  <div id="headline">
    <span>🎵 أحدث أخبار الفن العربي والعالمي — راديو ع هواك 🎙️</span>
  </div>
</div>

<script>
const headline = document.getElementById("headline");

const feeds = [
  "https://news.google.com/rss/search?q=" +
  encodeURIComponent("أخبار الفن والمشاهير والأغاني") +
  "&hl=ar&gl=SA&ceid=SA:ar",

  "https://news.google.com/rss/search?q=" +
  encodeURIComponent("music entertainment movies celebrities") +
  "&hl=en-US&gl=US&ceid=US:en"
];

let newsItems = [];
let current = 0;

function showMessage(message) {
  headline.innerHTML = "";

  const span = document.createElement("span");
  span.textContent = message;
  headline.appendChild(span);
}

async function loadFeed(url) {
  const proxy = "https://proxy.cors.dev/";
  const response = await fetch(proxy + url);

  if (!response.ok) {
    throw new Error("RSS request failed");
  }

  const xmlText = await response.text();
  const xml = new DOMParser().parseFromString(
    xmlText,
    "application/xml"
  );

  if (xml.querySelector("parsererror")) {
    throw new Error("Invalid RSS response");
  }

  return Array.from(xml.querySelectorAll("item"))
    .map(item => ({
      title: item.querySelector("title")?.textContent?.trim() || ""
    }))
    .filter(item => item.title);
}

function showNext() {
  if (!newsItems.length) return;

  const item = newsItems[current % newsItems.length];

  showMessage("🎬 " + item.title + "   |   راديو ع هواك 🎙️");

  current++;
}

async function updateNews() {
  showMessage("⏳ جاري تحميل آخر الأخبار الفنية...");

  try {
    const results = await Promise.all(
      feeds.map(loadFeed)
    );

    const allItems = results.flat();

    const unique = new Map();

    allItems.forEach(item => {
      if (item.title) {
        unique.set(item.title, item);
      }
    });

    newsItems = Array.from(unique.values());

    if (newsItems.length > 0) {
      current = 0;
      showNext();
    } else {
      showMessage("🎙️ لا توجد أخبار متاحة حاليًا — راديو ع هواك");
    }

  } catch (error) {
    console.error("News loading error:", error);

    showMessage("⚠️ تعذر تحميل الأخبار حاليًا — راديو ع هواك");
  }
}

updateNews();

setInterval(updateNews, 30 * 60 * 1000);
setInterval(showNext, 25000);
</script>

</body>
</html>
