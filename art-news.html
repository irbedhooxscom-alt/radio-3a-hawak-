
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>أخبار الفن العربي - راديو ع هواك</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Tahoma, Arial, sans-serif;
}

.news {
  width: 100%;
  height: 100px;
  display: flex;
  align-items: center;
  background: linear-gradient(90deg, #160b35, #32105c, #160b35);
  border-right: 6px solid #ff1744;
  color: white;
  overflow: hidden;
}

.label {
  flex-shrink: 0;
  background: #d41445;
  padding: 12px 18px;
  font-size: 23px;
  font-weight: bold;
  z-index: 2;
}

#headline {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  font-size: 27px;
  font-weight: bold;
  padding: 0 20px;
  direction: rtl;
}

#headline span {
  display: inline-block;
  white-space: nowrap;
  animation: move 55s linear infinite;
}

@keyframes move {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(100%);
  }
}
</style>
</head>

<body>

<div class="news">
  <div class="label">🎵 أخبار الفن العربي</div>

  <div id="headline">
    <span>🎙️ راديو ع هواك — أخبار الأغاني والألبومات والحفلات العربية ❤️</span>
  </div>
</div>

<script>
const headline = document.getElementById("headline");

let newsItems = [];
let current = 0;

function showMessage(message) {
  headline.innerHTML = "";

  const span = document.createElement("span");
  span.textContent = message;

  headline.appendChild(span);
}

function cleanTitle(title) {
  if (!title) return "";

  return title
    .replace(/\s+/g, " ")
    .replace(/^[\s\-|–—:]+|[\s\-|–—:]+$/g, "")
    .trim();
}

// استبعاد عناوين الأقسام والكلمات العامة
function isValidNews(item) {
  const title = cleanTitle(item.title_ar || item.title);

  if (!title || title.length < 18) return false;

  const blockedTitles = [
    "فيديو",
    "فيديوهات",
    "ألبوم",
    "ألبومات",
    "أخبار",
    "الرئيسية",
    "المزيد",
    "مشاهدة"
  ];

  if (blockedTitles.includes(title)) return false;

  return true;
}

function showNext() {
  if (!newsItems.length) return;

  const item = newsItems[current % newsItems.length];

  const arabicTitle = cleanTitle(
    item.title_ar || item.title
  );

  showMessage(
    "🎤 " + arabicTitle +
    "  |  " + (item.source || "أخبار الفن العربي") +
    "  |  راديو ع هواك 🎙️"
  );

  current++;
}

async function updateNews() {
  showMessage("⏳ جاري تحديث أخبار الفن العربي...");

  try {
    const response = await fetch(
      "./art-news.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("تعذر الوصول إلى ملف الأخبار");
    }

    const data = await response.json();

    if (!Array.isArray(data.news)) {
      throw new Error("صيغة ملف الأخبار غير صحيحة");
    }

    const unique = new Map();

    data.news.forEach(item => {
      if (!isValidNews(item)) return;

      const key = item.link || cleanTitle(item.title_ar || item.title);

      if (!unique.has(key)) {
        unique.set(key, item);
      }
    });

    newsItems = Array.from(unique.values())
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    if (newsItems.length > 0) {
      current = 0;
      showNext();
    } else {
      showMessage(
        "🎙️ لا توجد أخبار فنية جديدة حالياً — راديو ع هواك ❤️"
      );
    }

  } catch (error) {
    console.error("Radio news error:", error);

    showMessage(
      "⚠️ تعذر تحديث الأخبار — سنحاول مجدداً — راديو ع هواك"
    );
  }
}

// تحميل الأخبار عند فتح الصفحة
updateNews();

// الانتقال إلى خبر جديد كل 55 ثانية
setInterval(showNext, 55000);

// تحديث الأخبار كل 5 دقائق
setInterval(updateNews, 5 * 60 * 1000);

</script>

</body>
</html>
